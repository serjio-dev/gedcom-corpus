id: xref-rename-551
description: >-
  5.5.1 → 7.0 xref edge cases: @1@ is valid in 7.0 and kept; @X1@ already exists, so new
  names skip it; a record called @VOID@ (reserved in 7.0) and @fam@ become @X2@ and @X3@ in
  record order, pointers to them follow, an extension pointer (_FRIEND) included; @x1@ differs
  from @X1@ only in case, so it dangles and becomes @VOID@; a NOTE pointer that leads nowhere
  (@Smith family@, text written without @@) stays text. Text keeps a leading @@ (on the
  first line and on a CONT line) and loses the doubling of an inner one.
