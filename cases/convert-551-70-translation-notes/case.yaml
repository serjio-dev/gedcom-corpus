id: convert-551-70-translation-notes
description: >-
  5.5.1 → 7.0 of FONE and ROMN of a name with NOTE and SOUR, which a 5.5.1 name piece structure
  has and a 7.0 TRAN does not: they stay under the TRAN as extensions with their tags (_NOTE,
  _SOUR, KL2001); converting down makes them NOTE and SOUR again. The NOTE pointer under ROMN
  stays a NOTE (_NOTE @N1@): it becomes SNOTE only where 7.0 has SNOTE, as the one of NAME does.
