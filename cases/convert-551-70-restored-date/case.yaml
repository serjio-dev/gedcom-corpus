id: convert-551-70-restored-date
description: >-
  5.5.1 → 7.0 of _DATE under FAM.NCHI, as 7.0 → 5.5.1 writes a 7.0 FAM.NCHI.DATE (5.5.1 has no
  DATE there): the extension becomes DATE again and its value is converted as a 5.5.1 date, so INT
  1900 (about then) becomes 1900 with PHRASE about then. It used to stay INT 1900 (about then), which
  is no 7.0 date.
