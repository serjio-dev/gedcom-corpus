id: tgc-55c
description: >-
  GEDCOM 5.5 torture test of H. Eichmann, extended by J. A. Nairn (GEDitCOM, 1997–2001):
  TGC55C.ged, in which the "Joseph Tag Torture" record has two NAME structures. Every 5.5 tag, ANSEL with every special character including the GEDCOM 5.5 "LDS
  extensions" (empty and black box, midline e and o), CR line ends, an encoded multimedia record.
  The file permits copying and use for any non-commercial purpose, so it is fetched, not
  committed (scripts/fetch-external.py), from a mirror at a fixed commit whose copy has the hash of
  a second mirror (cacack/gedcom-go). The file says it is 100% valid 5.5; it is not against the
  5.5 grammars, and these are the errors: media FORM values 5.5 does not list (URL, PDF, mov, …),
  ROLE without parentheses, AGE without a unit (76, 3 months), Hebrew and French dates without a
  calendar escape, CONL Y, ASSO without TYPE, SLGS STAT Child, a free-text CALN.MEDI.
source:
  origin: torture-test
  url: https://github.com/rbur004/gedcom/blob/45951f938875b57724f40a9967fcc423b8ee9a08/test/test_data/TGC55C.ged
  commit: 45951f938875b57724f40a9967fcc423b8ee9a08
  path: test/test_data/TGC55C.ged
